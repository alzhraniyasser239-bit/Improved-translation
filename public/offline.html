<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F54EB">
<title>لا يوجد اتصال · المترجم الذكي</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
         font-family: "Segoe UI", Tahoma, system-ui, -apple-system, Roboto, sans-serif;
         background: #EAEFF3; color: #10202D; }
  main { max-width: 420px; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 20px 0 10px; }
  p { line-height: 1.6; color: #5B6B78; margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; padding: 12px 20px; min-height: 44px; border: 0; border-radius: 10px;
           background: #2F54EB; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #091822; color: #E7EEF3; }
    p { color: #8CA0AF; }
    button { background: #7896FF; color: #091822; }
  }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>الترجمة تحتاج إلى اتصال بالإنترنت. أعد الاتصال ثم حاول مرة أخرى.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة</button>
</main>
</body>
</html>
